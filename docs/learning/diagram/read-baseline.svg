<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" role="img" aria-labelledby="title desc">
<title id="title">目标旧文仍在，为什么还是要重读</title><desc id="desc">机制示意。用户在memberTotal添加日志后，standardTotal旧文没变，但模型仍见旧文本，当前工具上下文仍持旧mtime与size，磁盘已经是带日志的新文件。Edit先比较基线，检测到变化就拒绝。重新Read后再局部修改普通价，保留会员日志。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#2456a6" stroke-width="1.7"/></marker>
<marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#596b81" stroke-width="1.7"/></marker>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172638;font-size:20px}
.title{font-size:26px;font-weight:700} .heading{font-size:21px;font-weight:700}
.small{font-size:18px;fill:#596b81} .blue{fill:#2456a6} .amber{fill:#9a5b11}
.code{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:19px}
</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="32" y="43" class="title" text-anchor="start">目标原文还在，读取依据也可能已经过时</text>
<text x="32" y="78" class="small" text-anchor="start">机制示意；时间与大小是有限的陈旧检测，不是内容哈希。</text>
<rect x="32" y="110" width="816" height="72" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="52" y="140" class="heading amber" text-anchor="start">用户给 memberTotal 加一条 console.log。</text>
<text x="52" y="168" class="" text-anchor="start">standardTotal 的原文未变，但整份文件已经变了。</text>
<text x="160" y="223" class="heading" text-anchor="middle">模型收到的文本</text>
<rect x="32" y="245" width="256" height="125" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="160.0" y="276" class="" text-anchor="middle">仍是无日志的旧文件</text>
<text x="160.0" y="306" class="" text-anchor="middle">据此组织旧文与新文</text>
<text x="440" y="223" class="heading" text-anchor="middle">当前 ToolContext</text>
<rect x="312" y="245" width="256" height="125" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="440.0" y="276" class="" text-anchor="middle">仍是旧 mtime、size</text>
<text x="440.0" y="306" class="" text-anchor="middle">持有旧基线 M0</text>
<text x="720" y="223" class="heading" text-anchor="middle">磁盘当前文件</text>
<rect x="592" y="245" width="256" height="125" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="720.0" y="276" class="" text-anchor="middle">已有会员日志，大小改变</text>
<text x="720.0" y="306" class="" text-anchor="middle">当前元信息成为 M1</text>
<text x="160" y="412" class="small" text-anchor="middle">模型尚未看见日志</text>
<path d="M440 370 V450" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M720 370 V410 H440" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="450" width="816" height="88" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="440.0" y="481" class="heading amber" text-anchor="middle">Edit 先比较 M0 与 M1：不同就拒绝</text>
<text x="440.0" y="511" class="" text-anchor="middle">此时还没有查找旧文、替换内容或保存文件</text>
<path d="M440 538 V580" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="580" width="816" height="92" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="440.0" y="611" class="heading blue" text-anchor="middle">重新 Read → 看见日志并更新基线 → 再 Edit 普通价</text>
<text x="440.0" y="641" class="" text-anchor="middle">以最新文件为基础，只改 standardTotal，会员函数及其日志保留</text>
<text x="32" y="714" class="small" text-anchor="start">代价：即使改动位于另一个函数，也要重新确认当前文件；程序没有自动做三方合并。</text>
</svg>
