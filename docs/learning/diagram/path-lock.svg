<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1110" role="img" aria-labelledby="title desc">
<title id="title">完整锁与不同上下文怎样影响并发修改</title><desc id="desc">机制示意，非并发实测。初始普通价和会员价均为200。A要把普通价改为九折，B把会员价改为八折。无完整锁时双方可能先读旧文件，B最后写回200和160，抹去A的180。完整锁下，共享ctx的B能读到A的新文件，最终180和160；独立ctx仍持旧基线的B先拒绝，重读后再改。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#2456a6" stroke-width="1.7"/></marker>
<marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#596b81" stroke-width="1.7"/></marker>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172638;font-size:20px}
.title{font-size:26px;font-weight:700} .heading{font-size:21px;font-weight:700}
.small{font-size:18px;fill:#596b81} .blue{fill:#2456a6} .amber{fill:#9a5b11}
.code{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:19px}
</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="32" y="43" class="title" text-anchor="start">完整读改写排队以后，后一个操作基于哪一版？</text>
<text x="32" y="78" class="small" text-anchor="start">A 改普通价九折；B 改会员价八折。数值均指购买 2 件、单价 100。</text>
<text x="32" y="119" class="heading" text-anchor="start">1  无完整锁：双方先读旧全文，后写者带回另一处旧值</text>
<text x="32" y="151" class="small" text-anchor="start">括号内依次为（普通价，会员价）。</text>
<path d="M222 230 H246" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M436 230 H460" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M650 230 H674" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="180" width="190" height="120" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="127.0" y="211" class="" text-anchor="middle">A 读初始文件</text>
<text x="127.0" y="241" class="" text-anchor="middle">(200, 200)</text>
<text x="127.0" y="269" class="" text-anchor="middle">算出 (180, 200)</text>
<rect x="246" y="180" width="190" height="120" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="341.0" y="211" class="" text-anchor="middle">B 也读初始文件</text>
<text x="341.0" y="241" class="" text-anchor="middle">(200, 200)</text>
<text x="341.0" y="269" class="" text-anchor="middle">算出 (200, 160)</text>
<rect x="460" y="180" width="190" height="120" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="555.0" y="211" class="" text-anchor="middle">A 写自己的全文</text>
<text x="555.0" y="241" class="" text-anchor="middle">(180, 200)</text>
<text x="555.0" y="269" class="" text-anchor="middle">普通价已打九折</text>
<rect x="674" y="180" width="190" height="120" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="769.0" y="211" class="" text-anchor="middle">B 再写自己的全文</text>
<text x="769.0" y="241" class="" text-anchor="middle">(200, 160)</text>
<text x="769.0" y="269" class="" text-anchor="middle">普通价退回 200</text>
<rect x="32" y="322" width="832" height="55" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="48" y="356" class="amber" text-anchor="start">丢失发生在 B 写回：它计算新全文时，并没有取得 A 的改动。</text>
<text x="32" y="428" class="heading" text-anchor="start">2  完整锁，共享 ctx：A 完成并刷新以后，B 再读取</text>
<path d="M222 528 H246" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M436 528 H460" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M650 528 H674" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="478" width="190" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="127.0" y="509" class="" text-anchor="middle">A 进入路径锁</text>
<text x="127.0" y="539" class="" text-anchor="middle">核对 → 读 → 算</text>
<text x="127.0" y="567" class="" text-anchor="middle">基于 (200, 200)</text>
<rect x="246" y="478" width="190" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="341.0" y="509" class="" text-anchor="middle">A 保存并刷新</text>
<text x="341.0" y="539" class="" text-anchor="middle">(180, 200)</text>
<text x="341.0" y="567" class="" text-anchor="middle">共享基线成为 M1</text>
<rect x="460" y="478" width="190" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="555.0" y="509" class="" text-anchor="middle">B 取得同一把锁</text>
<text x="555.0" y="539" class="" text-anchor="middle">核对 M1，读新文件</text>
<text x="555.0" y="567" class="" text-anchor="middle">基于 (180, 200)</text>
<rect x="674" y="478" width="190" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="769.0" y="509" class="" text-anchor="middle">B 保存并刷新</text>
<text x="769.0" y="539" class="" text-anchor="middle">(180, 160)</text>
<text x="769.0" y="567" class="" text-anchor="middle">两处改动都保留</text>
<text x="32" y="642" class="blue" text-anchor="start">锁的范围：基线检查 → 读取 → 计算 → 保存 → 刷新。</text>
<text x="32" y="675" class="small" text-anchor="start">B 基于 A 写后的文件计算；锁没有替它合并两份旧结果。</text>
<text x="32" y="730" class="heading" text-anchor="start">3  完整锁，独立 ctx：A 的刷新不会更新 B 的旧基线</text>
<path d="M280 838 H324" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M572 838 H616" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="780" width="248" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="156.0" y="811" class="" text-anchor="middle">A 写入并刷新自己的 ctx</text>
<text x="156.0" y="841" class="" text-anchor="middle">磁盘：(180, 200)</text>
<text x="156.0" y="869" class="" text-anchor="middle">A 的基线成为 M1</text>
<rect x="324" y="780" width="248" height="120" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="448.0" y="811" class="" text-anchor="middle">B 仍持 M0，比较时拒绝</text>
<text x="448.0" y="841" class="" text-anchor="middle">检测到磁盘已变化</text>
<text x="448.0" y="869" class="" text-anchor="middle">还没有执行 B 的替换</text>
<rect x="616" y="780" width="248" height="120" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="740.0" y="811" class="" text-anchor="middle">B 重读后再 Edit</text>
<text x="740.0" y="841" class="" text-anchor="middle">看到 A 的最新结果</text>
<text x="740.0" y="869" class="" text-anchor="middle">可继续到 (180, 160)</text>
<text x="32" y="946" class="small" text-anchor="start">上例以元信息变化可被检测、旧文仍能定位且没有后续干扰为前提。</text>
<text x="32" y="1002" class="small" text-anchor="start">机制示意，非并发实测；同一工具批次还会先对持久副作用设置执行屏障。</text>
<text x="32" y="1040" class="small" text-anchor="start">路径锁只协调同一进程中使用这套锁的代码，外部编辑器不参与这把锁。</text>
<text x="32" y="1078" class="blue" text-anchor="start">文件锁提供先后次序，读取基线决定排到自己时旧观察是否仍可使用。</text>
</svg>
