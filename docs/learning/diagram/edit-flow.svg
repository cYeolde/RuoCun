<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1120" role="img" aria-labelledby="title desc">
<title id="title">一次局部编辑怎样检查、执行与纠正</title><desc id="desc">机制示意。Read向模型展示prices.mjs并留下读取基线。模型填写旧文和新文。Edit在同路径锁内检查已读和基线、读取当前全文、查找旧串并计数，再保存和刷新。未找到时重读，多处匹配时补足上下文。成功后还要核对差异和相关运行结果。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#2456a6" stroke-width="1.7"/></marker>
<marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#596b81" stroke-width="1.7"/></marker>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172638;font-size:20px}
.title{font-size:26px;font-weight:700} .heading{font-size:21px;font-weight:700}
.small{font-size:18px;fill:#596b81} .blue{fill:#2456a6} .amber{fill:#9a5b11}
.code{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:19px}
</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="32" y="43" class="title" text-anchor="start">一次局部编辑：用当前文件决定能否修改</text>
<text x="32" y="78" class="small" text-anchor="start">机制示意；模型负责提出内容，程序负责核对条件和执行。</text>
<rect x="65" y="350" width="735" height="555" rx="7" fill="#fff" stroke="#b8c5d5" stroke-dasharray="6 5"/>
<text x="85" y="378" class="small" text-anchor="start">同路径锁内</text>
<path d="M320 190 V230" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M320 310 V395" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M320 475 V540" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M320 620 V735" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M320 840 V970" fill="none" stroke="#2456a6" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M520 435 H560" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<path d="M795 435 H820 V150 H520" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<path d="M520 575 H560" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<path d="M795 577 H820 V435" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<path d="M520 600 H540 V705 H560" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<path d="M795 705 H850 V270 H520" fill="none" stroke="#596b81" stroke-width="1.8" marker-end="url(#muted-arrow)"/>
<rect x="120" y="110" width="400" height="80" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="320.0" y="141" class="heading blue" text-anchor="middle">Read：读取 prices.mjs</text>
<text x="320.0" y="171" class="" text-anchor="middle">展示文本，同时记录基线</text>
<rect x="120" y="230" width="400" height="80" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="320.0" y="261" class="heading" text-anchor="middle">模型填写 Edit 参数</text>
<text x="320.0" y="291" class="" text-anchor="middle">路径、旧文、新文及是否全部替换</text>
<rect x="120" y="395" width="400" height="80" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="320.0" y="426" class="heading" text-anchor="middle">检查已读记录与读取基线</text>
<text x="320.0" y="456" class="" text-anchor="middle">观察过这份文件，且未检测到变化</text>
<rect x="560" y="395" width="235" height="80" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="677.5" y="426" class="heading amber" text-anchor="middle">拒绝并要求 Read</text>
<text x="677.5" y="456" class="" text-anchor="middle">未读，或基线已失效</text>
<rect x="120" y="540" width="400" height="80" rx="7" fill="#f4f6f9" stroke="#dce3ec"/>
<text x="320.0" y="571" class="heading" text-anchor="middle">读取当前全文，找旧串并计数</text>
<text x="320.0" y="601" class="" text-anchor="middle">匹配的是磁盘内容，不是旧行号</text>
<rect x="560" y="540" width="235" height="75" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="677.5" y="571" class="heading amber" text-anchor="middle">旧文未找到</text>
<text x="677.5" y="601" class="" text-anchor="middle">Read 后重新取得原文</text>
<rect x="560" y="660" width="235" height="110" rx="7" fill="#fbf6ea" stroke="#e9dcc3"/>
<text x="677.5" y="691" class="heading amber" text-anchor="middle">单处编辑却匹配多处</text>
<text x="677.5" y="721" class="" text-anchor="middle">补足区分目标的上下文</text>
<text x="677.5" y="749" class="" text-anchor="middle">旧文和新文都保留结构</text>
<text x="100" y="677" class="small" text-anchor="start">唯一，或明确全部替换</text>
<rect x="120" y="735" width="400" height="105" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="320.0" y="766" class="heading blue" text-anchor="middle">生成新全文与差异，再保存</text>
<text x="320.0" y="796" class="" text-anchor="middle">临时文件替换目标路径</text>
<text x="320.0" y="824" class="" text-anchor="middle">成功后刷新当前上下文的基线</text>
<rect x="120" y="970" width="400" height="80" rx="7" fill="#eaf0fa" stroke="#a9bfde"/>
<text x="320.0" y="1001" class="heading blue" text-anchor="middle">返回结果，核对目标</text>
<text x="320.0" y="1031" class="" text-anchor="middle">看差异，并运行与改动相关的检查</text>
<text x="32" y="1090" class="small" text-anchor="start">图中省略许可与取消等分支；副作用结果无法确认时，另按未知结果停止。</text>
</svg>
