<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 282" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">两次流式断线的区别在哪里？</title>
  <desc id="description">半个 SSE 事件断线时字节仍在缓冲区，屏幕尚无文字。文字已显示后断线时，屏幕保留“我先提交价格测试”，后续半份参数还在缓冲区。这两个推演现场均未启动工具。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="282" fill="#fff"/>
  <text x="34" y="44" class="heading" text-anchor="start">断线时点</text>
  <text x="340" y="44" class="heading" text-anchor="start">仍在缓冲区</text>
  <text x="706" y="44" class="heading" text-anchor="start">已经显示在屏幕</text>
  <path d="M34 62H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 154H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="116" class="body" text-anchor="start">半个事件尚未收完</text>
  <text x="34" y="212" class="body" text-anchor="start">文字已交付，后半段断线</text>
  <rect x="340" y="82" width="245" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="462.5" y="117.0" class="code-muted" text-anchor="middle">半个 SSE 事件</text>
  <rect x="340" y="178" width="245" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="462.5" y="213.0" class="body" text-anchor="middle">后续半份工具参数</text>
  <rect x="706" y="82" width="360" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="886.0" y="117.0" class="muted" text-anchor="middle">无可见文字</text>
  <rect x="706" y="178" width="360" height="56" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="886.0" y="213.0" class="blue" text-anchor="middle">我先提交价格测试</text>
  <path d="M595 110H631" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M638 104L648 116M638 116L648 104" fill="none" stroke="#8a4b08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M654 110H693" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <path d="M595 206H631" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M638 200L648 212M638 212L648 200" fill="none" stroke="#8a4b08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M654 206H693" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="706" y="259" class="small" text-anchor="start">这两个现场都未启动工具</text>
</svg>
