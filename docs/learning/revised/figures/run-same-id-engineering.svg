<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">看到普通价 PASS，能确认整趟运行结束吗？</title>
  <desc id="description">对 run-price-7 来说，前台已有普通价 PASS 日志，移到后台后仍沿同一个运行编号观察。此时进程继续执行，尚无终态和退出码。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="320" fill="#fff"/>
  <text x="34" y="43" class="muted" text-anchor="start">本次运行</text>
  <text x="146" y="43" class="code-blue" text-anchor="start">run-price-7</text>
  <text x="473" y="88" class="heading" text-anchor="middle">前台：用例输出通过</text>
  <text x="848" y="88" class="heading" text-anchor="middle">切到后台：沿用原编号</text>
  <path d="M379 104H987" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M473 104H848" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M34 124H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 196H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 268H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="167" class="heading" text-anchor="start">观察到的日志</text>
  <text x="34" y="239" class="heading" text-anchor="start">原进程终态</text>
  <rect x="346" y="137" width="254" height="47" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="473.0" y="167.5" class="code-blue" text-anchor="middle">普通价 PASS</text>
  <rect x="721" y="137" width="254" height="47" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="848.0" y="167.5" class="body" text-anchor="middle">保留已收日志</text>
  <rect x="346" y="209" width="254" height="47" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="473.0" y="239.5" class="muted" text-anchor="middle">还在运行</text>
  <rect x="721" y="209" width="254" height="47" rx="6" fill="#fff7e6" stroke="#d49b51" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="848.0" y="239.5" class="amber" text-anchor="middle">仍在运行 · 无退出码</text>
</svg>
