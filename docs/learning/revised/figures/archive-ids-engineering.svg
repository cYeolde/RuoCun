<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" role="img" aria-labelledby="title desc" viewBox="0 0 1080 269" width="1080" height="269">
  <title id="title">两条「检查通过」，分别在查什么？</title>
  <desc id="desc">两条工具回包都写着检查通过。第一条用 r-smoke 找到启动检查，第二条用 r-member 找到过期会员的价格预览，确认按普通价算。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#57606a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#8a4b08" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#1f2328; font-size:22px; }
      .label { font-weight:600; }
      .small { font-size:20px; fill:#57606a; }
      .head { font-size:20px; font-weight:600; fill:#57606a; }
      .mono, .mono-blue, .mono-small { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
      .mono-small { font-size:20px; }
      .mono-blue, .blue-text { fill:#0969da; font-weight:600; }
      .amber-text { fill:#8a4b08; font-weight:600; }
      .plain { fill:#fff; stroke:#d0d7de; }
      .soft { fill:#f6f8fa; stroke:#d0d7de; }
      .blue { fill:#edf6ff; stroke:#0969da; }
      .amber { fill:#fff7e6; stroke:#b0804f; }
      .plain, .soft, .blue, .amber { stroke-width:1.5; }
      .line-gray, .line-blue, .line-amber, .line-muted { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .line-gray { stroke:#57606a; }
      .line-blue { stroke:#0969da; }
      .line-amber { stroke:#8a4b08; }
      .line-muted { stroke:#d0d7de; }
    </style>
  </defs>
  <rect width="1080" height="269" fill="#fff"/>
  <text x="30" y="35" text-anchor="start" class="head">回包文字</text>
  <text x="308" y="35" text-anchor="start" class="head">对应的 tool_call_id</text>
  <text x="650" y="35" text-anchor="start" class="head">那次调用实际查了什么</text>
  <rect x="30" y="58" width="202" height="75" rx="8" class="soft"/>
  <text x="131.0" y="102.5" text-anchor="middle" class="label">检查通过</text>
  <rect x="30" y="166" width="202" height="75" rx="8" class="soft"/>
  <text x="131.0" y="210.5" text-anchor="middle" class="label">检查通过</text>
  <rect x="306" y="58" width="258" height="75" rx="8" class="soft"/>
  <text x="435.0" y="102.5" text-anchor="middle" class="mono">r-smoke</text>
  <rect x="306" y="166" width="258" height="75" rx="8" class="blue"/>
  <text x="435.0" y="210.5" text-anchor="middle" class="mono-blue">r-member</text>
  <rect x="650" y="58" width="399" height="75" rx="8" class="plain"/>
  <text x="849.5" y="89.5" text-anchor="middle" class="label">启动检查</text>
  <text x="849.5" y="121.5" text-anchor="middle" class="small">只确认商店能启动</text>
  <rect x="650" y="166" width="399" height="75" rx="8" class="blue"/>
  <text x="849.5" y="197.5" text-anchor="middle" class="label">过期会员走预览入口</text>
  <text x="849.5" y="229.5" text-anchor="middle" class="small">核对是否按普通价算</text>
  <path d="M232 95 H306" class="line-gray" marker-end="url(#gray-arrow)"/>
  <path d="M564 95 H650" class="line-gray" marker-end="url(#gray-arrow)"/>
  <path d="M232 203 H306" class="line-blue" marker-end="url(#blue-arrow)"/>
  <path d="M564 203 H650" class="line-blue" marker-end="url(#blue-arrow)"/>
</svg>
