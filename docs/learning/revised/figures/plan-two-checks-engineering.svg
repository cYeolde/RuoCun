<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">普通价确认后，哪条预览还缺验收结果？</title>
  <desc id="description">同一个 shop/preview.mjs 入口要分别检查普通价和会员价。要求普通价 180 元、会员价 200 元。推演中已有普通价的页面观察，会员价的观察仍待补齐。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="270" fill="#fff"/>
  <text x="34" y="35" class="muted" text-anchor="start">预览入口</text>
  <text x="143" y="35" class="code-blue" text-anchor="start">shop/preview.mjs</text>
  <text x="42" y="88" class="heading" text-anchor="start">验收对象</text>
  <text x="386" y="88" class="heading" text-anchor="start">用户要求</text>
  <text x="765" y="88" class="heading" text-anchor="start">预览结果</text>
  <path d="M36 107H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 173H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 241H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="147" class="body" text-anchor="start">普通价</text>
  <text x="386" y="147" class="body" text-anchor="start">180 元</text>
  <rect x="762" y="119" width="268" height="44" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="896.0" y="148.0" class="blue" text-anchor="middle">180 元 · 已观察</text>
  <text x="42" y="213" class="body" text-anchor="start">会员价</text>
  <text x="386" y="213" class="body" text-anchor="start">200 元</text>
  <rect x="762" y="185" width="268" height="44" rx="6" fill="#fff7e6" stroke="#d49b51" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="896.0" y="214.0" class="amber" text-anchor="middle">待测 · 没有结果</text>
</svg>
