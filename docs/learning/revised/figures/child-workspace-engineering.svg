<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 302" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">同一个相对文件名，为什么会读到两份不同的内容？</title>
  <desc id="description">主代理从 /shop 解析 pricing.py，读到含未提交改动的 /shop/pricing.py，价格 90 元。子代理从基于提交创建的 /review 解析同名路径，读到 /review/pricing.py，价格仍为 100 元。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="302" fill="#fff"/>
  <text x="36" y="46" class="heading" text-anchor="start">执行方</text>
  <text x="246" y="46" class="heading" text-anchor="start">工作目录</text>
  <text x="645" y="46" class="heading" text-anchor="start">实际打开</text>
  <text x="968" y="46" class="heading" text-anchor="start">价格</text>
  <path d="M35 65H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 161H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 259H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="36" y="118" class="body" text-anchor="start">主代理</text>
  <rect x="213" y="82" width="195" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="310.5" y="118.0" class="code" text-anchor="middle">/shop</text>
  <path d="M414 111H616" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="515.0" y="96" class="code-muted" text-anchor="middle">pricing.py</text>
  <rect x="621" y="77" width="303" height="68" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="772.5" y="104.0" class="code-blue" text-anchor="middle">/shop/pricing.py</text>
  <text x="772.5" y="132.0" class="small" text-anchor="middle">有未提交改动</text>
  <text x="1000" y="118" class="heading" text-anchor="middle">90 元</text>
  <text x="36" y="215" class="body" text-anchor="start">子代理</text>
  <rect x="213" y="179" width="195" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="310.5" y="215.0" class="code" text-anchor="middle">/review</text>
  <path d="M414 208H616" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="515.0" y="193" class="code-muted" text-anchor="middle">pricing.py</text>
  <rect x="621" y="174" width="303" height="68" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="772.5" y="201.0" class="code-blue" text-anchor="middle">/review/pricing.py</text>
  <text x="772.5" y="229.0" class="small" text-anchor="middle">从当前提交创建</text>
  <text x="1000" y="215" class="heading" text-anchor="middle">100 元</text>
</svg>
