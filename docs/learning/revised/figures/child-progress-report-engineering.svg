<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 391" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">主代理收到进度和收到报告分别意味着什么？</title>
  <desc id="description">子代理读取的 pricing.py 原文留在子会话。调查中跨给主代理的是“已找到入口”的进度，主代理可见运行编号。完成后交回最终报告中的路径、行号和证据，程序另从同一运行记录取得终态。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="391" fill="#fff"/>
  <text x="385" y="45" class="heading" text-anchor="middle">还在查找</text>
  <text x="810" y="45" class="heading" text-anchor="middle">工作完成后</text>
  <path d="M33 62H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 198H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 353H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M153 62V353" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M595 62V353" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="121" class="heading" text-anchor="start">子代理</text>
  <text x="34" y="271" class="heading" text-anchor="start">主代理</text>
  <rect x="234" y="82" width="302" height="61" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="385.0" y="105.5" class="code" text-anchor="middle">pricing.py 原文</text>
  <text x="385.0" y="133.5" class="muted" text-anchor="middle">留在子会话</text>
  <rect x="234" y="155" width="302" height="35" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="385.0" y="179.5" class="small" text-anchor="middle">已找到入口</text>
  <rect x="667" y="107" width="284" height="65" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="809.0" y="132.5" class="blue" text-anchor="middle">最终报告</text>
  <text x="809.0" y="160.5" class="muted" text-anchor="middle">路径、行号、证据</text>
  <rect x="234" y="260" width="302" height="63" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="385.0" y="284.5" class="muted" text-anchor="middle">运行编号</text>
  <text x="385.0" y="312.5" class="body" text-anchor="middle">进度：已找到入口</text>
  <rect x="643" y="260" width="231" height="63" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="758.5" y="284.5" class="blue" text-anchor="middle">收到最终报告</text>
  <text x="758.5" y="312.5" class="muted" text-anchor="middle">可按证据复查</text>
  <rect x="897" y="260" width="153" height="63" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="973.5" y="284.5" class="muted" text-anchor="middle">同一运行记录</text>
  <text x="973.5" y="312.5" class="muted" text-anchor="middle">单独确认终态</text>
  <path d="M385 190V255" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="407" y="230" class="small" text-anchor="start">进度消息</text>
  <path d="M758 173V255" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="777" y="230" class="small" text-anchor="start">交付报告</text>
</svg>
