<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 324" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">暂停后，旧回调还能把界面改回等待中吗？</title>
  <desc id="description">原运行代号 12 的等待回调在暂停后才到达。暂停已把当前代号推进到 13。两个代号不同，调度器不接纳旧状态并保留暂停。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="324" fill="#fff"/>
  <text x="34" y="41" class="heading" text-anchor="start">当前会话</text>
  <rect x="200" y="62" width="246" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="323.0" y="85.0" class="body" text-anchor="middle">代号 12</text>
  <text x="323.0" y="113.0" class="muted" text-anchor="middle">回合正在运行</text>
  <rect x="651" y="62" width="313" height="60" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="807.5" y="85.0" class="blue" text-anchor="middle">代号 13</text>
  <text x="807.5" y="113.0" class="muted" text-anchor="middle">已暂停</text>
  <path d="M456 92H640" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="548.0" y="77" class="muted" text-anchor="middle">用户按下暂停</text>
  <path d="M34 158H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="216" class="heading" text-anchor="start">晚到的回调</text>
  <rect x="200" y="183" width="246" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="323.0" y="205.0" class="body" text-anchor="middle">代号 12</text>
  <text x="323.0" y="233.0" class="muted" text-anchor="middle">交回等待句柄</text>
  <rect x="514" y="183" width="234" height="58" rx="6" fill="#fff7e6" stroke="#d49b51" stroke-width="1.25"/>
  <text x="631.0" y="205.0" class="code" text-anchor="middle">12 ≠ 13</text>
  <text x="631.0" y="233.0" class="amber" text-anchor="middle">代号不匹配</text>
  <rect x="820" y="183" width="215" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="927.5" y="205.0" class="body" text-anchor="middle">丢弃旧更新</text>
  <text x="927.5" y="233.0" class="muted" text-anchor="middle">继续保持暂停</text>
  <path d="M455 212H505" fill="none" stroke="#7d8895" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/>
  <path d="M755 212H811" fill="none" stroke="#8a4b08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <path d="M806 122V145H632V179" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
</svg>
