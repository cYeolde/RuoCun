<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title>为什么只给写入上锁，还是会丢掉前一处修改？</title>
<desc>示例每对数字依次为普通价、会员价。只给写入上锁时，B 提前从两价都是 200 的旧文件生成 200／160，随后盖掉 A 写的 180／200。若两次 Edit 共用工具上下文并把检查、读取、替换、写入与刷新都放在锁内，B 拿锁后基于 180／200 计算，最终得到 180／160。</desc>
<defs><style>text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; } text.mono { font-family: "Cascadia Code", Consolas, monospace; }</style>
<marker id="gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#7d8895" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#0969da" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8a4b08" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1100" height="350" fill="#fff"/>
<path d="M28 159 L1071 159" stroke="#dce1e7" fill="none"/>
<path d="M466 92H478" fill="none" stroke="#7d8895" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" marker-end="url(#gray)"/>
<path d="M714 92H733" fill="none" stroke="#7d8895" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" marker-end="url(#gray)"/>
<path d="M466 219H478" fill="none" stroke="#7d8895" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" marker-end="url(#gray)"/>
<path d="M714 219H733" fill="none" stroke="#0969da" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" marker-end="url(#blue)"/>
<text x="109" y="34" text-anchor="middle" font-size="19" fill="#57606a">锁的范围</text>
<text x="344" y="34" text-anchor="middle" font-size="19" fill="#57606a">A 写完前</text>
<text x="599" y="34" text-anchor="middle" font-size="19" fill="#57606a">A 写完后</text>
<text x="881" y="34" text-anchor="middle" font-size="19" fill="#57606a">B 得锁并写完</text>
<text x="108" y="108" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">只锁落盘</text>
<text x="108" y="234" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">锁住读改写</text>
<rect x="214" y="58" width="250" height="67" rx="6" fill="#fff7e6" stroke="#dfb374"/>
<text x="339.0" y="87.5" text-anchor="middle" font-size="21" fill="#8a4b08" font-weight="600">B 已算出 200／160</text>
<text x="339.0" y="114.5" text-anchor="middle" font-size="18" fill="#57606a">仍是旧普通价</text>
<rect x="483" y="58" width="229" height="67" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="597.5" y="87.5" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">文件为 180／200</text>
<text x="597.5" y="114.5" text-anchor="middle" font-size="18" fill="#57606a">A 的改动已写入</text>
<rect x="739" y="58" width="296" height="67" rx="6" fill="#fff7e6" stroke="#dfb374"/>
<text x="887.0" y="87.5" text-anchor="middle" font-size="21" fill="#8a4b08" font-weight="600">文件为 200／160</text>
<text x="887.0" y="114.5" text-anchor="middle" font-size="18" fill="#57606a">A 的改动被盖掉</text>
<rect x="214" y="185" width="250" height="67" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="339.0" y="214.5" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">B 等锁</text>
<text x="339.0" y="241.5" text-anchor="middle" font-size="18" fill="#57606a">还没有读全文</text>
<rect x="483" y="185" width="229" height="67" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="597.5" y="214.5" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">B 读到 180／200</text>
<text x="597.5" y="241.5" text-anchor="middle" font-size="18" fill="#57606a">沿用 A 的改动</text>
<rect x="739" y="185" width="296" height="67" rx="6" fill="#edf6ff" stroke="#91bce6"/>
<text x="887.0" y="214.5" text-anchor="middle" font-size="21" fill="#0969da" font-weight="600">文件为 180／160</text>
<text x="887.0" y="241.5" text-anchor="middle" font-size="18" fill="#57606a">两处改动都保留</text>
<text x="107" y="294" text-anchor="start" font-size="18" fill="#57606a">同一工具上下文</text>
<text x="107" y="322" text-anchor="start" font-size="18" fill="#57606a">每对数字依次为普通价／会员价</text>
</svg>
