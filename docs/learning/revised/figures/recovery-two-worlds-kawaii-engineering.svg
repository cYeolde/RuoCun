<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 351" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">聊天缺回包时，原测试已经启动了吗？</title>
  <desc id="description">两个现场中，本地都超时且没有工具回包。启动请求在执行器开始前中断时，测试未启动。执行器已经启动测试、返回通路中断时，原运行确实存在。应沿原运行查证。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="351" fill="#fff"/>
  <text x="32" y="44" class="heading" text-anchor="start">中断现场</text>
  <text x="271" y="44" class="heading" text-anchor="start">本地程序</text>
  <text x="773" y="44" class="heading" text-anchor="start">执行器</text>
  <path d="M32 62H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 178H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="110" class="heading" text-anchor="start">启动前中断</text>
  <text x="32" y="226" class="heading" text-anchor="start">启动后回包丢失</text>
  <rect x="271" y="87" width="202" height="65" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="372.0" y="112.5" class="body" text-anchor="middle">本地超时</text>
  <text x="372.0" y="140.5" class="small" text-anchor="middle">聊天未收到工具回包</text>
  <rect x="271" y="203" width="202" height="65" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="372.0" y="228.5" class="body" text-anchor="middle">本地超时</text>
  <text x="372.0" y="256.5" class="small" text-anchor="middle">聊天未收到工具回包</text>
  <rect x="773" y="87" width="278" height="65" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="912.0" y="112.5" class="muted" text-anchor="middle">未获启动许可</text>
  <text x="912.0" y="140.5" class="body" text-anchor="middle">测试未启动</text>
  <rect x="773" y="203" width="278" height="65" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="912.0" y="228.5" class="muted" text-anchor="middle">原运行已创建</text>
  <text x="912.0" y="256.5" class="body" text-anchor="middle">测试已启动</text>
  <path d="M473 121H604" fill="none" stroke="#7d8895" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/>
  <path d="M610 115L620 127M610 127L620 115" fill="none" stroke="#8a4b08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M628 121H770" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="531" y="103" class="small" text-anchor="middle">启动请求</text>
  <path d="M473 221H768" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="620.5" y="206" class="small" text-anchor="middle">启动请求</text>
  <path d="M771 251H649" fill="none" stroke="#7d8895" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)" stroke-dasharray="6 5"/>
  <path d="M633 245L643 257M633 257L643 245" fill="none" stroke="#8a4b08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M626 251H476" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="717" y="273" class="small" text-anchor="middle">结果回包</text>
  <text x="773" y="314" class="blue" text-anchor="start">先核对原运行记录</text>
</svg>
