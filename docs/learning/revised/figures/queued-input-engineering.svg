<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 316" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">“再查一下订单预览页”什么时候进入模型请求？</title>
  <desc id="description">补充输入先作为编号 12 的 queued 记录提交，原模型历史和已发请求仍没有这句话。工具回包配齐后，输入与其消费状态一同提交，这句话作为新 user 消息进入后续模型请求。</desc>
  <defs>
    <style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; font-size: 22px; }
.heading { font-size: 21px; font-weight: 600; }
.muted { font-size: 19px; fill: #57606a; }
.small { font-size: 17px; fill: #57606a; }
.blue { font-weight: 600; fill: #0969da; }
.amber { font-size: 20px; font-weight: 600; fill: #8a4b08; }
.code, .code-blue, .code-muted { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-size: 21px; }
.code-blue { fill: #0969da; }
.code-muted { fill: #57606a; font-size: 19px; }
    </style>
<marker id="arrow-neutral" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7d8895" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a4b08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="316" fill="#fff"/>
  <text x="370" y="42" class="heading" text-anchor="middle">程序接纳补充</text>
  <text x="857" y="42" class="heading" text-anchor="middle">回包齐全后的下一次请求</text>
  <path d="M34 67H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 161H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 264H1066" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="117" class="heading" text-anchor="start">检查点</text>
  <text x="34" y="212" class="heading" text-anchor="start">模型可见</text>
  <rect x="191" y="85" width="358" height="56" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="370.0" y="106.0" class="code-blue" text-anchor="middle">12 · queued</text>
  <text x="370.0" y="134.0" class="muted" text-anchor="middle">再查一下订单预览页</text>
  <rect x="678" y="85" width="358" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="857.0" y="120.0" class="code-muted" text-anchor="middle">12 · 已消费</text>
  <rect x="191" y="183" width="358" height="59" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="370.0" y="219.5" class="muted" text-anchor="middle">原请求没有这句补充</text>
  <rect x="678" y="183" width="358" height="59" rx="6" fill="#edf6ff" stroke="#91bce6" stroke-width="1.25"/>
  <text x="857.0" y="219.5" class="blue" text-anchor="middle">user · 再查一下订单预览页</text>
  <path d="M549 114H613V212H673" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="624" y="176" class="small" text-anchor="start">提交</text>
</svg>
