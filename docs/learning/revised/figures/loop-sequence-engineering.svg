<text x="96" y="161" text-anchor="end" font-size="19" fill="#57606a">本地程序</text>
<text x="96" y="282" text-anchor="end" font-size="19" fill="#57606a">模型</text>
<text x="119" y="53" text-anchor="end" font-size="17" fill="#57606a">时间</text>
<rect x="130" y="89" width="172" height="62" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="216.0" y="126.12" text-anchor="middle" font-size="18" fill="#1f2328" font-weight="600">普通价打折了吗？</text>
<rect x="356" y="275" width="160" height="48" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="436.0" y="306.48" text-anchor="middle" font-size="22" fill="#1f2328" class="mono">Read</text>
