<text x="229" y="204" text-anchor="start" font-size="18" fill="#57606a">第 1 次请求</text>
<text x="448" y="230" text-anchor="start" font-size="18" fill="#57606a">要求读文件</text>
<text x="823" y="211" text-anchor="start" font-size="18" fill="#0969da">第 2 次请求 · 带上工具回包</text>
