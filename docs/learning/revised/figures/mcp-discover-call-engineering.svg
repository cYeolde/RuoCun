<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" role="img" aria-labelledby="title desc" viewBox="0 0 1080 454" width="1080" height="454">
  <title id="title">远程工具已登记，如何到模型手里并执行查询？</title>
  <desc id="desc">上半图中 docs 通过 tools/list 提供 search_notes，宿主登记第六项工具，ToolSearch 激活后完整定义在下一次模型请求可见。下半图中模型选中工具，宿主检查参数和权限，再调用 docs 的 tools/call 查询会员预览，取得结果后送入后续模型请求。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#57606a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#8a4b08" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#1f2328; font-size:22px; }
      .label { font-weight:600; }
      .small { font-size:20px; fill:#57606a; }
      .head { font-size:20px; font-weight:600; fill:#57606a; }
      .mono, .mono-blue, .mono-small { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
      .mono-small { font-size:20px; }
      .mono-blue, .blue-text { fill:#0969da; font-weight:600; }
      .amber-text { fill:#8a4b08; font-weight:600; }
      .plain { fill:#fff; stroke:#d0d7de; }
      .soft { fill:#f6f8fa; stroke:#d0d7de; }
      .blue { fill:#edf6ff; stroke:#0969da; }
      .amber { fill:#fff7e6; stroke:#b0804f; }
      .plain, .soft, .blue, .amber { stroke-width:1.5; }
      .line-gray, .line-blue, .line-amber, .line-muted { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .line-gray { stroke:#57606a; }
      .line-blue { stroke:#0969da; }
      .line-amber { stroke:#8a4b08; }
      .line-muted { stroke:#d0d7de; }
    </style>
  </defs>
  <rect width="1080" height="454" fill="#fff"/>
  <text x="28" y="34" text-anchor="start" class="head">工具说明什么时候交给模型</text>
  <rect x="28" y="57" width="211" height="97" rx="8" class="soft"/>
  <text x="133.5" y="99.5" text-anchor="middle" class="mono">docs</text>
  <text x="133.5" y="131.5" text-anchor="middle" class="mono-small">tools/list</text>
  <rect x="291" y="57" width="238" height="97" rx="8" class="soft"/>
  <text x="410.0" y="99.5" text-anchor="middle" class="mono">search_notes</text>
  <text x="410.0" y="131.5" text-anchor="middle" class="small">第 6 项 · 已登记</text>
  <rect x="565" y="57" width="145" height="97" rx="8" class="plain"/>
  <text x="637.5" y="112.5" text-anchor="middle" class="mono">ToolSearch</text>
  <rect x="753" y="57" width="300" height="97" rx="8" class="blue"/>
  <text x="903" y="96" text-anchor="middle" class="mono-small">mcp__docs__search_notes</text>
  <text x="903" y="125" text-anchor="middle" class="blue-text">下一次模型请求可见</text>
  <path d="M239 106 H291" class="line-gray" marker-end="url(#gray-arrow)"/>
  <path d="M529 106 H565" class="line-blue" marker-end="url(#blue-arrow)"/>
  <path d="M710 106 H753" class="line-blue" marker-end="url(#blue-arrow)"/>
  <path d="M28 188 H1052" class="line-muted"/>
  <text x="28" y="224" text-anchor="start" class="head">模型选中以后，查询怎么走</text>
  <rect x="28" y="247" width="200" height="111" rx="8" class="soft"/>
  <text x="128.0" y="296.5" text-anchor="middle" class="label">模型</text>
  <text x="128.0" y="328.5" text-anchor="middle" class="small">发起工具调用</text>
  <rect x="297" y="247" width="250" height="111" rx="8" class="soft"/>
  <text x="422.0" y="296.5" text-anchor="middle" class="label">宿主</text>
  <text x="422.0" y="328.5" text-anchor="middle" class="small">检查参数和权限</text>
  <rect x="790" y="247" width="263" height="111" rx="8" class="blue"/>
  <text x="921.5" y="296.5" text-anchor="middle" class="mono-blue">docs</text>
  <text x="921.5" y="328.5" text-anchor="middle" class="mono-small">tools/call</text>
  <path d="M228 302 H297" class="line-gray" marker-end="url(#gray-arrow)"/>
  <path d="M547 287 H790" class="line-blue" marker-end="url(#blue-arrow)"/>
  <text x="668" y="272" text-anchor="middle" class="small">查询「会员预览」</text>
  <path d="M790 328 H548" class="line-blue" marker-end="url(#blue-arrow)"/>
  <text x="668" y="354" text-anchor="middle" class="small">会员预览保留原价</text>
  <path d="M421 358 V402 H128 V358" class="line-gray" marker-end="url(#gray-arrow)"/>
  <text x="189" y="430" text-anchor="start" class="small">结果进入后续模型请求</text>
</svg>
