<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 292" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title>批准的是 pricing.txt，改目标后还可以继续吗？</title>
<desc>两行里用户都同意 A，即 pricing.txt。实际目标仍是 A 时，可以继续后续检查。目标变为 B，即 draft/pricing.txt 时，A 的同意无法用在 B 上，程序应按最终参数重新裁决。</desc>
<defs><style>text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; } text.mono { font-family: "Cascadia Code", Consolas, monospace; }</style>
